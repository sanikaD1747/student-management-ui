<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Student Management Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    /* Critical FOUC Prevention CSS */
    body {
      background-color: #F4F7FE;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .dashboard-container {
      display: flex;
      height: 100vh;
      width: 100%;
    }
    @media (max-width: 991px) {
      .dashboard-container {
        display: block;
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        z-index: 1050;
        width: 240px;
        background-color: #4361EE;
      }
    }
  </style>
</head>
