<div class="animate-fade-in mx-auto text-center" style="max-width: 600px; padding-top: 4rem;">
  <i class="bi bi-gear-wide-connected" style="font-size: 6rem; color: var(--primary-color);"></i>
  
  <h2 class="fw-bold mt-4 mb-3" style="color: var(--text-primary);">Dashboard Settings</h2>
  
  <p class="text-secondary mb-5" style="font-size: 1.1rem; line-height: 1.6;">
    Control panel configurations and user profile settings are currently locked for non-administrative accounts during this evaluation.
  </p>

  <div class="card-custom text-start mb-4 border shadow-sm">
    <h5 class="fw-semibold mb-3 border-bottom pb-2" style="color: var(--text-primary);">
      <i class="bi bi-brush me-2"></i> Appearance Settings
    </h5>
    
    <div class="d-flex justify-content-between align-items-center mb-3 p-2 rounded" style="background: rgba(67, 97, 238, 0.05);">
      <div>
        <div class="fw-medium" style="color: var(--text-primary);">Dark Mode Toggle</div>
        <div class="small text-secondary">Switch between light and dark visual themes</div>
      </div>
      <div class="form-check form-switch" style="font-size: 1.25rem;">
        <input class="form-check-input" type="checkbox" role="switch" id="themeSwitch" [checked]="isDarkMode" (change)="toggleTheme()">
      </div>
    </div>
  </div>

  <a routerLink="/students" class="btn text-white fw-bold px-4 py-2 mt-2 shadow-sm" style="background: var(--primary-color); border-radius: 12px;">
    <i class="bi bi-arrow-left me-2"></i> Return to Directory
  </a>
</div>
