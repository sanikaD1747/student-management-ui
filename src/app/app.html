<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar shadow-lg">
    <div class="sidebar-brand">
      <i class="bi bi-rocket-takeoff-fill"></i> EduManage
    </div>
    <div class="sidebar-menu">
      <a routerLink="/students" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        class="nav-item-custom">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/students/add" routerLinkActive="active" class="nav-item-custom">
        <i class="bi bi-person-plus-fill"></i>
        <span>Register Student</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item-custom">
        <i class="bi bi-gear-fill"></i>
        <span>Settings</span>
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Navbar -->
    <div class="top-navbar">
      <div>
        <h4 class="brand-text m-0 fw-bold" style="color: var(--text-primary); letter-spacing: -0.5px;">Hello Manager! 👋
        </h4>
      </div>
      <div class="header-actions">
        <div class="search-wrapper me-3 d-none d-lg-block" style="width: 250px;">
          <i class="bi bi-search"></i>
          <input type="text" class="search-input" placeholder="Search students..." [(ngModel)]="globalSearch" (keyup.enter)="onSearch()">
        </div>
        <button class="notif-toggle">
          <i class="bi bi-bell-fill"></i>
        </button>
        <button class="theme-toggle" (click)="toggleTheme()"
          [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill'"></i>
        </button>
        <div class="user-profile ms-2">
          <div class="avatar-circle shadow-sm"
            style="width: 40px; height: 40px; background: var(--primary-color); color: white;">SM</div>
          <span class="name d-none d-md-block">System Admin</span>
          <i class="bi bi-chevron-down text-secondary ms-1" style="font-size: 0.8rem;"></i>
        </div>
      </div>
    </div>

    <!-- Router Outlet -->
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
